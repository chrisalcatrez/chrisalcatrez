name: UNN senden
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: unn, cancel-in-progress: false}
jobs:
  senden:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Schleife alle 5 Minuten (ca. 5h45)
        env: {TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"}
        run: |
          git config user.name "UNN Bot"; git config user.email "unn@users.noreply.github.com"
          ende=$((SECONDS + 345*60))
          while [ $SECONDS -lt $ende ]; do
            git pull --rebase -q || true
            python3 unn/senden.py || echo "senden.py Fehler"
            git add unn/gesendet.json unn/letzter_versand.txt 2>/dev/null || git add unn/gesendet.json
            git diff --cached --quiet || (git commit -q -m "UNN: gesendet" && (git push -q || (git pull --rebase -q && git push -q)))
            sleep 300
          done
